name: Backend Mypy Check

on:
  pull_request:
    paths:
      - "backend/**/*.py"
      - "backend/mypy.ini"
      - ".github/workflows/mypy-backend.yml"
  push:
    branches: [ main, master ]
    paths:
      - "backend/**/*.py"
      - "backend/mypy.ini"
      - ".github/workflows/mypy-backend.yml"

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy

      - name: Run mypy (typed routers)
        run: |
          mypy --config-file backend/mypy.ini backend/routers/user.py backend/routers/payments.py backend/routers/numerology.py backend/routers/tts.py backend/routers/content.py
