name: Security Guardrails

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  security-guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run security guardrails
        run: python security/security_guardrails.py
