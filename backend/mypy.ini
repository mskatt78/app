[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = False
no_implicit_optional = False
check_untyped_defs = False
disallow_untyped_defs = False
follow_imports = skip

[mypy-backend.routers.user]
check_untyped_defs = True
disallow_untyped_defs = False
