services:
  - type: web
    name: shamanic-yoga-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: shamanic_yoga
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: shamanic-yoga-frontend
    env: static
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    rootDir: frontend
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
