name: backend-mypy

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-mypy.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-mypy.yml"

jobs:
  mypy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy
          pip install types-requests types-pytz

      - name: Run mypy on typed routers
        run: |
          mypy --config-file backend/mypy.ini \
            backend/routers/user.py \
            backend/routers/admin.py \
            backend/routers/birth_chart.py
